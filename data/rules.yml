version: "3.1"

rules:
- rule: Greet user
  steps:
  - intent: greet
  - action: utter_greet

- rule: Say goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Answer carbon footprint question
  steps:
  - intent: ask_carbon_footprint_estimate
  - action: action_calculate_carbon

- rule: Compare transport modes
  steps:
  - intent: compare_transport_modes
  - action: action_compare_transport_modes

- rule: Recommend sustainable accommodation
  steps:
  - intent: ask_sustainable_accommodation
  - action: action_fetch_accommodation
  - action: action_rank_options
  - action: utter_present_recommendation

- rule: Explain carbon offsets
  steps:
  - intent: ask_offset_options
  - action: utter_offset_options

- rule: Handle trip details
  steps:
  - intent: provide_trip_details
  - action: action_get_location

- rule: Explain bot capabilities
  steps:
  - intent: ask_general_info
  - action: utter_general_info

- rule: Handle out of scope
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Confirm user choice
  steps:
  - intent: affirm
  - action: utter_affirm

- rule: Handle denial
  steps:
  - intent: deny
  - action: utter_deny

- rule: Answer bot identity question
  steps:
  - intent: bot_challenge
  - action: utter_bot_challenge

- rule: Thank the user
  steps:
  - intent: thank_you
  - action: utter_thank_you

- rule: Explain local transport
  steps:
  - intent: ask_local_transport_options
  - action: action_find_transport
  - action: utter_local_transport_options

- rule: Suggest an itinerary
  steps:
  - intent: request_itinerary_suggestion
  - action: action_describe_place
  - action: action_find_attractions
  - action: utter_itinerary_suggestion

- rule: Human agent request
  steps:
  - intent: request_human_agent
  - action: action_human_handover
  - action: utter_handover_notice

- rule: Receive feedback
  steps:
  - intent: provide_feedback
  - action: utter_feedback_received

- rule: Cancel current request
  steps:
  - intent: cancel_request
  - action: utter_cancel_request

- rule: Define carbon footprint
  steps:
  - intent: ask_carbon_footprint_definition
  - action: utter_carbon_footprint_definition

- rule: Suggest flight alternatives
  steps:
  - intent: ask_flight_alternatives
  - action: utter_flight_alternatives

- rule: Explain train routes
  steps:
  - intent: ask_train_routes
  - action: utter_train_routes

- rule: Explain electric vehicle rentals
  steps:
  - intent: ask_electric_vehicle_rental
  - action: utter_electric_vehicle_rental

- rule: Suggest bike rentals
  steps:
  - intent: ask_bike_rental_options
  - action: utter_bike_rental_options

- rule: Suggest walking tours
  steps:
  - intent: ask_walking_tour_options
  - action: utter_walking_tour_options

- rule: Handle weather question
  steps:
  - intent: ask_weather_forecast
  - action: action_get_weather

- rule: Handle currency question
  steps:
  - intent: ask_currency_exchange
  - action: action_convert_currency

- rule: Correct trip information
  steps:
  - intent: correct_information
  - action: utter_correct_information

- rule: Handle previous trip summary
  steps:
  - intent: ask_previous_trip_summary
  - action: utter_previous_trip_summary

- rule: Restart conversation
  steps:
  - intent: restart_conversation
  - action: utter_restart_conversation

- rule: Explain data privacy
  steps:
  - intent: ask_data_privacy
  - action: utter_data_privacy

- rule: Escalate complaint
  steps:
  - intent: escalate_complaint
  - action: action_human_handover
  - action: utter_escalate_complaint

- rule: Handle small talk
  steps:
  - intent: small_talk
  - action: utter_small_talk



- rule: Answer sustainability topic questions
  steps:
  - intent: ask_sustainability_topic
  - action: action_answer_sustainability_topic

- rule: Answer travel logistics questions
  steps:
  - intent: ask_travel_logistics
  - action: action_answer_travel_logistics

- rule: Handle NLU fallback
  steps:
  - intent: nlu_fallback
  - action: action_default_fallback