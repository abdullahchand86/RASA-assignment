version: "3.1"

stories:
- story: plan a lower-impact trip
  steps:
  - user: |
      hi
    intent: greet
  - action: utter_greet
  - user: |
      I'm traveling from Berlin to Kyoto
    intent: provide_trip_details
    entities:
    - origin: Berlin
    - destination: Kyoto
  - action: action_get_location
  - user: |
      estimate the carbon footprint of my trip
    intent: ask_carbon_footprint_estimate
  - action: action_calculate_carbon

- story: compare transport for a destination
  steps:
  - user: |
      what's greener, train or plane to Paris
    intent: compare_transport_modes
    entities:
    - destination: Paris
  - action: action_compare_transport_modes

- story: find sustainable accommodation
  steps:
  - user: |
      suggest eco-friendly hotels in Lisbon
    intent: ask_sustainable_accommodation
    entities:
    - destination: Lisbon
  - action: action_fetch_accommodation
  - action: action_rank_options
  - action: utter_present_recommendation

- story: answer general sustainability questions
  steps:
  - user: |
      how can I make my trip greener
    intent: ask_sustainability_topic
    entities:
    - topic: general_tips
  - action: action_answer_sustainability_topic
  - user: |
      how can I offset my emissions
    intent: ask_offset_options
  - action: utter_offset_options

- story: fallback clarification
  steps:
  - user: |
      asdkjh
    intent: nlu_fallback
  - action: action_default_fallback
  - user: |
      still not understood
    intent: nlu_fallback
  - action: action_default_fallback

- story: check destination practicalities
  steps:
  - user: |
      I want to visit Lisbon
    intent: provide_trip_details
    entities:
    - destination: Lisbon
  - action: action_get_location
  - user: |
      what's the weather like there
    intent: ask_weather_forecast
  - action: action_get_weather
  - user: |
      how do I get around in Lisbon
    intent: ask_local_transport_options
    entities:
    - destination: Lisbon
  - action: action_find_transport
  - action: utter_local_transport_options
  - user: |
      convert 500 pounds to euros
    intent: ask_currency_exchange
  - action: action_convert_currency
  - user: |
      suggest an eco-friendly itinerary
    intent: request_itinerary_suggestion
  - action: action_describe_place
  - action: action_find_attractions
  - action: utter_itinerary_suggestion