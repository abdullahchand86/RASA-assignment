version: "3.1"

stories:
- story: canonical sustainable trip flow
  steps:
  - user: |
      hi
    intent: greet
  - action: utter_greet
  - user: |
      I'm traveling from Berlin to Kyoto
    intent: provide_trip_details
    entities:
    - origin: Berlin
    - destination: Kyoto
  - action: action_get_location
  - user: |
      estimate my travel emissions
    intent: ask_carbon_footprint_estimate
  - action: action_calculate_carbon